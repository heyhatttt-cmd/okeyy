name: Zirve Okey APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle 9.3.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Debug imza ayarını düzelt
        run: |
          sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts

      - name: APK oluştur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Zirve-Okey-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
